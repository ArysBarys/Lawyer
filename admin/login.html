<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход — Админка ADALTIREK</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <main style="min-height:100vh;display:grid;place-items:center;padding:24px;">
      <form id="loginForm" style="width:100%;max-width:420px;background:#fff;padding:24px;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,0.12);">
        <h1 style="margin:0 0 8px">Вход в админку</h1>
        <p style="margin:0 0 16px;color:#666">Введите учётные данные администратора.</p>
        <label style="display:block;margin-bottom:8px"><span>Логин</span><input id="loginUser" type="text" required style="width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #ddd" /></label>
        <label style="display:block;margin-bottom:8px"><span>Пароль</span><input id="loginPass" type="password" required style="width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #ddd" /></label>
        <p id="error" style="color:#b33;margin:8px 0;display:none">Ошибка входа</p>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button type="submit" style="flex:1;padding:11px;border-radius:8px;border:none;background:#c79a59;color:#fff;font-weight:700">Войти</button>
          <a href="/admin/" style="display:inline-block;padding:11px 14px;border-radius:8px;border:1px solid #ccc;text-decoration:none;color:#333">Отмена</a>
        </div>
      </form>
    </main>

    <script src="/admin/auth.js"></script>
    <script>
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        document.getElementById('error').style.display = 'none';
        const username = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPass').value;
        try {
          await login(username, password);
          // on success, go to admin panel
          location.href = '/admin/';
        } catch (err) {
          document.getElementById('error').textContent = err.message || 'Ошибка входа';
          document.getElementById('error').style.display = 'block';
        }
      });
    </script>
  </body>
</html>
